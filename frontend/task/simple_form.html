<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
    <style>
    .bodyy{
        background-image: url(./img/background.webp);
        background-repeat: no-repeat;
        background-size: cover;
    }
    .namess{
        font-size:20px;
        display:inline-block;
        width:150px; 
    }

    .input{
        height:30px;
        width:250px;
    }

    form{
        width:450px;
        margin:auto;
    }
</style>
<script>
    function validateform() {
        let name = document.getElementById("name").value;
        let fathername = document.getElementById("fathername").value;
        let mothername = document.getElementById("mothername").value;
        let mobile = document.getElementById("mobile").value;
        let age = parseInt(document.getElementById("age").value);
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

    if (name === "" ) {
            alert("name cannot be empty!");
            return false;
        }
   
    if (fathername === "") {
        alert("Father Name cannot be empty!");
        return false;
        }

    if (mothername === "") {
        alert("Mother Name cannot be empty!");
        return false;
        }

    if (mobile === "" || isNaN(mobile) || mobile.length !== 10) {
        alert("Mobile number must be 10 digits!");
        return false;
    } 
    if (isNaN(age) || age < 1 || age > 100) {
    alert("Age must be between 1 and 100!");
    return false;
    }
    if (email === "" || !email.includes("@") || !email.includes("email") && !email.includes("gmail") || !email.includes(".") || !email.includes("com") ){
        alert("Please enter a valid email!");
       return false;
    }
    if (password === "" || password.length < 6){
       alert("Password must be at least 6 characters!");
      return false;
    }
        return true;
}
</script>
</head>
<body class="bodyy">
    <h2 style="font-size: 50px; text-align: center;">Registration Form</h2>
   
    <form onsubmit="return validateform()">
        <label class="namess">Name:</label>
        <input class="input" type="text" id="name">
        <br><br>
        <label class="namess">Father's Name:</label>
        <input class="input" type="text" id="fathername" >
        <br><br>
        <label class="namess">Mother's Name:</label>
        <input class="input" type="text" id="mothername" >
        <br><br>
        <label class="namess">Age:</label>
        <input class="input" type="number" id="age">
        <br><br>
        <label class="namess">Mobile Number:</label>
        <input class="input" type="tel" id="mobile">
        <br><br>
        <label class="namess">Email ID:</label>
        <input class="input" type="text" id="email">
        <br><br>
        <label class="namess">Password:</label>
        <input class="input" type="password" id="password">
        <br><br>
        <button style="height: 30px; width: 100px;" type="submit">submit</button>
        
    </form>
 
</body>
</html>
