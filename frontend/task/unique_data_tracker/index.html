
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unique Data Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <!-- ================= LEFT SIDE HISTORY ================= -->

        <div class="history-box">

            <h2>History</h2>

            <div id="history">
                <p class="empty-history">
                    No history yet
                </p>
            </div>

            <button class="clear-history" onclick="clearHistory()">
                Clear History
            </button>

        </div>


        <!-- ================= RIGHT SIDE MAIN ================= -->

        <div class="container">

            <h1>Unique Data Tracker</h1>


            <!-- FORM -->

            <div class="form-box">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                >


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                >


                
                 <label>Courses</label>

                <input
                    type="text"
                    id="courses"
                    placeholder="Enter Courses"
                >
                 <label>Score</label>

                <input
                    type="number"
                    id="score"
                    placeholder="Enter Score"
                >


            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    class="add-btn"
                    onclick="addUser()">
                    Add
                </button>


                <button
                    class="update-btn"
                    onclick="updateUserData()">
                    Update
                </button>


                <button
                    class="search-btn"
                    onclick="searchUser()">
                    Search
                </button>


                <button
                    class="remove-btn"
                    onclick="removeUser()">
                    Remove
                </button>


                <button
                    class="reset-btn"
                    onclick="resetSystem()">
                    Reset
                </button>

            </div>


            <!-- MESSAGE -->

            <div id="message">
                Message will appear here...
            </div>


            <!-- USERS -->

            <h2>All Users</h2>

            <div id="output"></div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
